name: Build & Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Boop-v0.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boop-v0.1.0.apk
          path: dist/Boop-v0.1.0.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "Boop for Android v0.1.0"
          body: |
            ### Boop Mobile App for Android (v0.1.0)

            Launch Mac apps directly from your Android phone over local WiFi.

            #### What's Included:
            - **Boop-v0.1.0.apk**: Installable Android application package
            - Automatic Mac discovery via mDNS / Bonjour
            - Quick 6-digit code pairing
            - Beautiful dock UI displaying your Mac's installed apps
            - Instant one-tap app launching

            #### How to Install:
            1. Download **Boop-v0.1.0.apk** below directly on your Android phone.
            2. Tap the downloaded file in your browser or Files app to install.
            3. (If prompted, enable "Install unknown apps" for your browser).
            4. Make sure your phone is on the same WiFi as your Mac running **Boop for Mac**.
            5. Open Boop, enter the 6-digit code from your Mac menu bar, and you're paired!
          files: dist/Boop-v0.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
